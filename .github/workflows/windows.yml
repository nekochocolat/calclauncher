name: Build CalcLauncher installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist -- --win --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalcLauncher-Windows
          path: dist/*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux installers
        run: npm run dist -- --linux --publish never

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: CalcLauncher-Linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: CalcLauncher-Windows
          path: dist

      - name: Download Linux installers
        uses: actions/download-artifact@v4
        with:
          name: CalcLauncher-Linux
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
